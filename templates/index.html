<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momir Command Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; text-align: center; margin: 0; padding: 10px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; padding-bottom: 50px; }
        h1 { color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5em; margin-bottom: 20px; }
        h3 { margin-top: 0; color: #00ffcc; font-size: 1.1em; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 20px; margin: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-item { background: #252525; padding: 10px; border-radius: 8px; border-bottom: 2px solid #00ffcc; }
        .stat-count { font-size: 1.2em; font-weight: bold; color: #00ffcc; }
        select, input, .btn { background: #333; color: white; border: 1px solid #555; padding: 12px; border-radius: 6px; font-size: 1em; margin: 8px 0; width: 100%; box-sizing: border-box; }
        .btn { cursor: pointer; font-weight: bold; border: none; transition: transform 0.1s, background 0.2s; }
        .btn-cmc { min-width: 45px; width: auto; background: #444; border: 1px solid #00ffcc; color: #00ffcc; padding: 8px; margin: 4px; display: inline-block; }
        .btn-print { background: #ff00ff; color: white; font-size: 1.2em; margin-top: 15px; }
        #previewArea { margin-top: 25px; padding-top: 20px; border-top: 2px solid #333; display: none; }
        #prevImg { width: 100%; max-width: 350px; border-radius: 12px; margin: 15px 0; border: 1px solid #444; }
        .oracle-box { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: left; border-left: 4px solid #00ffcc; font-size: 0.9em; white-space: pre-wrap; }
        .stats-badge { background: #444; color: #00ffcc; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .search-results { text-align: left; background: #222; border-radius: 8px; margin-top: 5px; max-height: 250px; overflow-y: auto; border: 1px solid #444; }
        .search-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; }
        .search-item:hover { background: #00ffcc; color: black; }
        .admin-card { border: 1px solid #ff00ff; margin-top: 40px; }
        .btn-sync { background: #cf6679; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Momir Command Center</h1>
        <div class="card">
            <h3>Datenbank Status</h3>
            <div id="statsDisplay" class="stats-grid">Lade Statistiken...</div>
        </div>
        <div class="card">
            <h3>Modus & Auswahl</h3>
            <select id="catSelect" onchange="uiSwitch()">
                <option value="creatures">Creatures</option>
                <option value="artifacts">Artifacts</option>
                <option value="battles">Battles</option>
                <option value="enchantments">Enchantments</option>
                <option value="instants">Instants</option>
                <option value="lands">Non-Basic Lands</option>
                <option value="planeswalkers">Planeswalkers</option>
                <option value="sorceries">Sorceries</option>
                <option value="unset">Un-Sets</option>
                <option value="global_search">Globale Suche</option>
                <option value="tokens">Tokens (Suche)</option>
            </select>
            <div id="cmcSection">
                <p>CMC wählen:</p>
                <div id="cmcButtonContainer"></div>
            </div>
            <div id="landSection" style="display: none;">
                <button class="btn" style="background:#00ffcc; color:black;" onclick="getRandomLand()">🎲 LAND WÜRFELN</button>
            </div>
            <div id="searchSection" style="display: none;">
                <input type="text" id="searchInput" placeholder="Kartenname tippen..." oninput="doSearch()">
                <div id="searchResults" class="search-results"></div>
            </div>
            <div id="previewArea">
                <h2 id="prevName" style="color: #00ffcc; margin: 0; text-align: left;"></h2>
                <div id="prevType" style="color: #888; font-size: 0.8em; text-align: left; margin-bottom: 10px;"></div>
                <img id="prevImg" src="" alt="Vorschau">
                <div id="prevStats" class="stats-badge"></div>
                <div id="prevOracle" class="oracle-box"></div>
                <button id="printBtn" class="btn btn-print" onclick="sendToPrint()">🖨️ JETZT DRUCKEN</button>
            </div>
        </div>
        <div class="card admin-card">
            <h3 style="color: #ff00ff;">Pi System-Steuerung</h3>
            <input type="password" id="adminToken" placeholder="Admin Passwort">
            <button class="btn btn-sync" onclick="triggerPiSync()">🔄 FULL SYNC AN PI SENDEN</button>
            <div id="syncStatus" style="display: none; margin-top: 10px;"></div>
        </div>
    </div>
    <script>
        let currentCard = null;
        async function loadStats() {
            try {
                const resp = await fetch('/api/stats');
                const data = await resp.json();
                const display = document.getElementById('statsDisplay');
                display.innerHTML = '';
                Object.keys(data).sort().forEach(cat => {
                    display.innerHTML += `<div class="stat-item"><div class="stat-count">${data[cat]}</div><div style="font-size: 0.7em;">${cat.toUpperCase()}</div></div>`;
                });
            } catch(e) {}
        }
        function uiSwitch() {
            const cat = document.getElementById('catSelect').value;
            const hideCMC = ['tokens', 'lands', 'global_search'].includes(cat);
            document.getElementById('cmcSection').style.display = hideCMC ? 'none' : 'block';
            document.getElementById('landSection').style.display = (cat === 'lands') ? 'block' : 'none';
            document.getElementById('searchSection').style.display = (cat === 'tokens' || cat === 'global_search') ? 'block' : 'none';
            if(!hideCMC) updateCMCButtons();
        }
        async function updateCMCButtons() {
            const cat = document.getElementById('catSelect').value;
            const container = document.getElementById('cmcButtonContainer');
            const resp = await fetch(`/api/cmcs/${cat}`);
            const cmcs = await resp.json();
            container.innerHTML = '';
            cmcs.forEach(cmc => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-cmc'; btn.innerText = cmc;
                btn.onclick = () => getPreview(cat, cmc);
                container.appendChild(btn);
            });
        }
        async function doSearch() {
            const q = document.getElementById('searchInput').value;
            const cat = document.getElementById('catSelect').value;
            if(q.length < 3) return;
            const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}&cat=${cat}`);
            const results = await resp.json();
            const resDiv = document.getElementById('searchResults');
            resDiv.innerHTML = '';
            results.forEach(t => {
                const d = document.createElement('div');
                d.className = 'search-item';
                d.innerText = t.name + (t.stats ? ` [${t.stats}]` : '');
                d.onclick = () => showPreview(t);
                resDiv.appendChild(d);
            });
        }
        async function getRandomLand() {
            const resp = await fetch('/api/random_land');
            showPreview(await resp.json());
        }
        async function getPreview(cat, cmc) {
            const resp = await fetch(`/api/random/${cat}/${cmc}`);
            showPreview(await resp.json());
        }
        function showPreview(data) {
            currentCard = data;
            document.getElementById('prevName').innerText = data.name;
            document.getElementById('prevType').innerText = data.type_line;
            document.getElementById('prevImg').src = data.image;
            document.getElementById('prevOracle').innerText = data.oracle_text || "";
            document.getElementById('prevStats').innerText = data.stats || "";
            document.getElementById('previewArea').style.display = 'block';
        }
        async function sendToPrint() {
            if(!currentCard) return;
            await fetch('/api/enqueue', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(currentCard) });
        }
        async function triggerPiSync() {
            const token = document.getElementById('adminToken').value;
            const status = document.getElementById('syncStatus');
            status.style.display = 'block';
            status.innerText = "⏳ Befehl wird gesendet...";
            try {
                const resp = await fetch('/api/trigger_sync', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token: token })
                });
                if(resp.ok) { status.innerText = "✅ SYNC GESTARTET!"; }
                else { status.innerText = "❌ Fehler: Passwort falsch!"; }
            } catch(e) { status.innerText = "❌ Netzwerkfehler!"; }
        }
        loadStats(); uiSwitch();
    </script>
</body>
</html>
